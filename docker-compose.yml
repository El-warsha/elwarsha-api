services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elwarsha
      POSTGRES_PASSWORD: elwarsha
      POSTGRES_DB: elwarsha
    ports:
      - "5432:5432"
    volumes:
      - elwarsha_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elwarsha"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  elwarsha_pg:
